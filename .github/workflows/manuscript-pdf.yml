name: Chapter 3 manuscript PDF

on:
  push:
    branches: [manuscript, manuscript-theory]
    paths:
      - 'manuscript/**'
      - 'images/**'
      - '.github/workflows/manuscript-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[pdf-generated]') }}
    name: Build AsciiDoc and publish PDF artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Install native STEM rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config bison flex fonts-lyx \
            fonts-liberation poppler-utils \
            libxml2-dev libxslt1-dev libgmp-dev libffi-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev \
            libzstd-dev libwebp-dev libgtk-3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Verify manuscript structure and assets
        run: python3 manuscript/verify-manuscript.py

      - name: Install PDF toolchain and build
        working-directory: manuscript
        run: |
          gem install bundler
          bundle install
          bash ./build-pdf.sh

      - name: Verify PDF preview style
        working-directory: manuscript
        run: bash ./verify-pdf-style.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-theory-pdf
          path: manuscript/CH03_Dadwal_World_Models_in_Action.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated PDF beside its source
        if: github.ref == 'refs/heads/manuscript' || github.ref == 'refs/heads/manuscript-theory'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$GITHUB_REF_NAME"
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced during this build; a newer run will publish the PDF."
            exit 0
          fi
          git add -f manuscript/CH03_Dadwal_World_Models_in_Action.pdf
          if git diff --cached --quiet; then
            echo "PDF is unchanged; no commit required."
            exit 0
          fi
          git commit -m "Theory-first PDF generated [pdf-generated]"
          git push origin "HEAD:${branch}"

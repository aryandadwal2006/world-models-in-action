name: Chapter 3 manuscript PDF

on:
  push:
    branches: [manuscript]
    paths:
      - 'manuscript/**'
      - 'images/**'
      - '.github/workflows/manuscript-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'build: update Chapter 3 PDF' }}
    name: Build AsciiDoc and publish PDF artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out manuscript branch
        uses: actions/checkout@v4

      - name: Install native STEM rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config bison flex fonts-lyx \
            libxml2-dev libxslt1-dev libgmp-dev libffi-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libglib2.0-dev \
            libzstd-dev libwebp-dev libgtk-3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Verify manuscript slots and image paths
        run: python3 manuscript/verify-manuscript.py

      - name: Install PDF toolchain and build
        working-directory: manuscript
        run: |
          gem install bundler
          bundle install
          bash ./build-pdf.sh

      - name: Check generated PDF
        run: test -s manuscript/CH03_Dadwal_World_Models_in_Action.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-manuscript-pdf
          path: manuscript/CH03_Dadwal_World_Models_in_Action.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated PDF beside its source
        if: github.ref == 'refs/heads/manuscript'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f manuscript/CH03_Dadwal_World_Models_in_Action.pdf
          if git diff --cached --quiet; then
            echo "PDF is unchanged; no commit required."
            exit 0
          fi
          git commit -m "build: update Chapter 3 PDF"
          git push origin HEAD:manuscript
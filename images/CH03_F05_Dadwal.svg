<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">From paired views to a contrastive loss</title><desc id="desc">Anchor, positive, and negative views lead to a temperature-scaled softmax classification loss.</desc><rect width="1100" height="520" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20242a;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700;fill:#315f91}.small{font-size:16px;fill:#434b55}.tiny{font-size:14px;fill:#59616b}.card{fill:#fff;stroke:#a8b2be;stroke-width:1.8}.blue{fill:#eaf2fb;stroke:#3b6fb6;stroke-width:2}.gold{fill:#fff3d8;stroke:#98712d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.line{stroke:#536273;stroke-width:2.5;fill:none}.accent{stroke:#3b6fb6;stroke-width:2.5;fill:none}</style>
<text x="36" y="42" class="title">Contrastive learning: pair identity becomes classification</text><rect x="28" y="70" width="505" height="405" rx="12" class="card"/><rect x="553" y="70" width="519" height="405" rx="12" class="card"/>
<text x="280" y="105" text-anchor="middle" class="head">1. Define candidates</text><rect x="53" y="132" width="142" height="132" rx="9" class="blue"/><rect x="209" y="132" width="142" height="132" rx="9" class="blue"/><rect x="365" y="132" width="142" height="132" rx="9" class="red"/><text x="124" y="157" text-anchor="middle" class="small" font-weight="700">Anchor</text><text x="280" y="157" text-anchor="middle" class="small" font-weight="700">Positive</text><text x="436" y="157" text-anchor="middle" class="small" font-weight="700">Negative</text>
<g transform="translate(124 202) scale(0.53)"><line x1="-56" y1="53" x2="65" y2="53" stroke="#697989" stroke-width="3"/><rect x="-30" y="24" width="57" height="24" rx="4" fill="#3B6FB6" stroke="#254f7f" stroke-width="2"/><circle cx="-16" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><circle cx="15" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><g transform="rotate(4 -1 26)"><line x1="-1" y1="26" x2="7" y2="-47" stroke="#3b4e60" stroke-width="8" stroke-linecap="round"/><circle cx="7" cy="-47" r="8" fill="#d99b40"/></g></g><g transform="translate(280 202) scale(0.53)"><line x1="-56" y1="53" x2="65" y2="53" stroke="#697989" stroke-width="3"/><rect x="-30" y="24" width="57" height="24" rx="4" fill="#3B6FB6" stroke="#254f7f" stroke-width="2"/><circle cx="-16" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><circle cx="15" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><g transform="rotate(4 -1 26)"><line x1="-1" y1="26" x2="7" y2="-47" stroke="#3b4e60" stroke-width="8" stroke-linecap="round"/><circle cx="7" cy="-47" r="8" fill="#d99b40"/></g></g><g transform="translate(436 202) scale(0.49)"><line x1="-56" y1="53" x2="65" y2="53" stroke="#697989" stroke-width="3"/><rect x="-30" y="24" width="57" height="24" rx="4" fill="#b84b41" stroke="#254f7f" stroke-width="2"/><circle cx="-16" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><circle cx="15" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><g transform="rotate(-25 -1 26)"><line x1="-1" y1="26" x2="7" y2="-47" stroke="#3b4e60" stroke-width="8" stroke-linecap="round"/><circle cx="7" cy="-47" r="8" fill="#d99b40"/></g></g>
<text x="280" y="294" text-anchor="middle" class="small">Same source, independent views</text><path d="M 124 310 C 158 333 219 333 253 310" class="accent"/><text x="188" y="355" text-anchor="middle" class="tiny">positive pair: pull together</text><path d="M 280 310 C 315 373 384 373 436 310" class="line"/><text x="363" y="394" text-anchor="middle" class="tiny">other frames: push apart</text><text x="280" y="443" text-anchor="middle" class="small">No human class label is needed.</text>
<text x="813" y="105" text-anchor="middle" class="head">2. Score candidates</text><rect x="578" y="132" width="143" height="102" rx="9" class="blue"/><rect x="743" y="132" width="143" height="102" rx="9" class="gold"/><rect x="908" y="132" width="140" height="102" rx="9" class="blue"/><text x="649" y="162" text-anchor="middle" class="small" font-weight="700">Similarity</text><text x="649" y="188" text-anchor="middle" class="small">sim(zᵢ,zⱼ) / τ</text><text x="649" y="212" text-anchor="middle" class="tiny">scaled logits</text><text x="814" y="162" text-anchor="middle" class="small" font-weight="700">Softmax</text><text x="814" y="188" text-anchor="middle" class="small">probabilities</text><text x="814" y="212" text-anchor="middle" class="tiny">over candidates</text><text x="978" y="162" text-anchor="middle" class="small" font-weight="700">Cross-entropy</text><text x="978" y="188" text-anchor="middle" class="small">−log p(positive)</text><text x="978" y="212" text-anchor="middle" class="tiny">reward correct match</text><path d="M 721 183 L 739 183" class="accent"/><path d="M 886 183 L 904 183" class="accent"/><text x="813" y="282" text-anchor="middle" class="small">Higher positive probability means lower loss.</text><text x="813" y="312" text-anchor="middle" class="small">Lower temperature sharpens score differences;</text><text x="813" y="336" text-anchor="middle" class="small">higher temperature makes probabilities uniform.</text><rect x="592" y="370" width="442" height="61" rx="8" class="card"/><text x="813" y="394" text-anchor="middle" class="small">The loss asks whether the paired view is more likely</text><text x="813" y="416" text-anchor="middle" class="small">than the other views in the batch.</text><text x="550" y="500" text-anchor="middle" class="tiny">Schematic only; scores depend on learned embeddings and temperature.</text></svg>
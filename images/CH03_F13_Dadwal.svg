<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Predicting a representation is not the same as reconstructing pixels</title><desc id="desc">Original schematic for a technical chapter on self-supervised representation learning.</desc><rect width="1100" height="450" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:22px}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#3B6FB6}.small{font-size:18px;fill:#444}.tiny{font-size:16px;fill:#555}.card{fill:#fff;stroke:#aab5c2;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3B6FB6;stroke-width:2}.gold{fill:#fff3d8;stroke:#b8862d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.green{fill:#e9f5ed;stroke:#43825c;stroke-width:2}.line{stroke:#596b7c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#3B6FB6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b98a6;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="40" y="42" class="title">The target determines what the model must predict</text>
<rect x="28" y="78" width="508" height="300" rx="12" class="card"/><rect x="564" y="78" width="508" height="300" rx="12" class="card"/>
<text x="282" y="116" text-anchor="middle" class="head">Latent prediction</text><text x="818" y="116" text-anchor="middle" class="head">Pixel reconstruction</text>
<rect x="54" y="145" width="128" height="55" rx="8" class="blue"/><text x="118" y="179" text-anchor="middle" class="small">context</text><rect x="220" y="145" width="126" height="55" rx="8" class="gold"/><text x="283" y="179" text-anchor="middle" class="small">predictor</text><rect x="386" y="145" width="124" height="55" rx="8" class="green"/><text x="448" y="179" text-anchor="middle" class="small">target latent</text><path d="M 182 172 L 216 172" class="accent"/><path d="M 346 172 L 382 172" class="accent"/>
<text x="282" y="239" text-anchor="middle" font-weight="700">Target: encoded future/state</text><text x="282" y="267" text-anchor="middle" class="small">Compare in representation space</text><text x="282" y="296" text-anchor="middle" class="small">No exact pixel match required</text>
<rect x="590" y="145" width="128" height="55" rx="8" class="blue"/><text x="654" y="179" text-anchor="middle" class="small">visible input</text><rect x="756" y="145" width="126" height="55" rx="8" class="gold"/><text x="819" y="179" text-anchor="middle" class="small">decoder</text><rect x="922" y="145" width="124" height="55" rx="8" class="green"/><text x="984" y="179" text-anchor="middle" class="small">pixel patches</text><path d="M 718 172 L 752 172" class="accent"/><path d="M 882 172 L 918 172" class="accent"/>
<text x="818" y="239" text-anchor="middle" font-weight="700">Target: hidden pixel values</text><text x="818" y="267" text-anchor="middle" class="small">Compute reconstruction error</text><text x="818" y="296" text-anchor="middle" class="small">Pixel detail affects the objective</text>
<text x="550" y="421" text-anchor="middle" class="tiny">These are different training targets; neither guarantees a sufficient physical state by itself.</text>
</svg>
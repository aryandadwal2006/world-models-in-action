<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
<rect width="1200" height="740" fill="#ffffff"/>
<text x="600" y="46" font-family="Georgia,serif" font-size="28" text-anchor="middle" fill="#222">Self-supervised learning: the signal defines the family</text>
<rect x="450" y="72" width="300" height="66" rx="10" fill="#eaf0f8" stroke="#3B6FB6" stroke-width="2"/>
<text x="600" y="100" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#222">Observed data</text><text x="600" y="123" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#333">views, sequences, pairs, tokens</text>
<path d="M600 138 V168 M600 168 H200 V197 M600 168 V197 M600 168 H1000 V197" stroke="#666" stroke-width="2" fill="none"/>
<rect x="55" y="197" width="290" height="92" rx="8" fill="#f5f5f5" stroke="#999"/>
<text x="200" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Candidate discrimination</text><text x="200" y="251" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#333">SimCLR · MoCo · CLIP</text><text x="200" y="273" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">positive versus sampled negatives</text>
<rect x="455" y="197" width="290" height="92" rx="8" fill="#f5f5f5" stroke="#999"/>
<text x="600" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Bootstrap / distillation</text><text x="600" y="251" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#333">BYOL · SimSiam · DINO</text><text x="600" y="273" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">predict a branch or teacher</text>
<rect x="855" y="197" width="290" height="92" rx="8" fill="#f5f5f5" stroke="#999"/>
<text x="1000" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Masked prediction</text><text x="1000" y="251" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#333">BERT · MAE · BEiT · data2vec</text><text x="1000" y="273" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">predict withheld targets</text>
<path d="M200 289 V326 M600 289 V326 M1000 289 V326 M200 326 H1000 M200 326 V352 M600 326 V352 M1000 326 V352" stroke="#777" stroke-width="2" fill="none"/>
<rect x="55" y="352" width="290" height="102" rx="8" fill="#eef4ee" stroke="#668866"/>
<text x="200" y="382" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Statistics / redundancy</text><text x="200" y="407" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#333">Barlow Twins · VICReg</text><text x="200" y="432" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">invariance + batch constraints</text>
<rect x="455" y="352" width="290" height="102" rx="8" fill="#eef4ee" stroke="#668866"/>
<text x="600" y="382" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Prototypes / clustering</text><text x="600" y="407" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#333">DeepCluster · SwAV</text><text x="600" y="432" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">assign examples to learned groups</text>
<rect x="855" y="352" width="290" height="102" rx="8" fill="#eef4ee" stroke="#668866"/>
<text x="1000" y="382" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Cross-modal / speech</text><text x="1000" y="407" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#333">SigLIP · wav2vec 2.0 · HuBERT</text><text x="1000" y="432" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">pairs and modality-specific targets</text>
<rect x="95" y="502" width="1010" height="84" rx="8" fill="#eaf0f8" stroke="#3B6FB6" stroke-width="1.5"/>
<text x="600" y="531" font-family="Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">Current directions</text>
<text x="600" y="556" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#333">DINOv3: scale and dense features · I-JEPA / V-JEPA: latent prediction</text>
<text x="600" y="576" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#555">Families overlap; the map groups dominant signals, not mutually exclusive methods.</text>
<text x="600" y="633" font-family="Georgia,serif" font-size="17" text-anchor="middle" fill="#333">Objective → target relationship → constraints → representation</text>
<text x="600" y="667" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#555">Low loss shows agreement with the target, not sufficiency for a world model.</text>
</svg>
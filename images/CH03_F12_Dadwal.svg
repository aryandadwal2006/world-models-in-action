<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Visible patches, latent encoding, and masked-patch reconstruction</title><desc id="desc">Original schematic for a technical chapter on self-supervised representation learning.</desc><rect width="1100" height="450" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:22px}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#3B6FB6}.small{font-size:18px;fill:#444}.tiny{font-size:16px;fill:#555}.card{fill:#fff;stroke:#aab5c2;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3B6FB6;stroke-width:2}.gold{fill:#fff3d8;stroke:#b8862d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.green{fill:#e9f5ed;stroke:#43825c;stroke-width:2}.line{stroke:#596b7c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#3B6FB6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b98a6;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="40" y="42" class="title">The encoder sees only visible patches; loss is computed on masked patches</text>
<text x="165" y="94" text-anchor="middle" class="head">Input patches</text><text x="436" y="94" text-anchor="middle" class="head">Encoder</text><text x="708" y="94" text-anchor="middle" class="head">Decoder tokens</text><text x="969" y="94" text-anchor="middle" class="head">Reconstruction target</text>
<g transform="translate(80 130)"><rect x="0" y="0" width="170" height="150" rx="7" fill="#f3f6f8" stroke="#9cabb9" stroke-width="2"/><path d="M 42 0 V150 M84 0 V150 M126 0 V150 M0 37.5 H170 M0 75 H170 M0 112.5 H170" stroke="#c1cbd4" stroke-width="1.5"/><rect x="42" y="0" width="42" height="37.5" fill="#3B6FB6"/><rect x="126" y="0" width="44" height="37.5" fill="#3B6FB6"/><rect x="0" y="37.5" width="42" height="37.5" fill="#b7c8d9"/><rect x="84" y="37.5" width="42" height="37.5" fill="#3B6FB6"/><rect x="42" y="75" width="42" height="37.5" fill="#3B6FB6"/><rect x="126" y="75" width="44" height="37.5" fill="#b7c8d9"/><rect x="0" y="112.5" width="42" height="37.5" fill="#3B6FB6"/><rect x="84" y="112.5" width="42" height="37.5" fill="#b7c8d9"/></g>
<text x="165" y="310" text-anchor="middle" class="small">Blue: visible</text><text x="165" y="333" text-anchor="middle" class="small">Grey: masked</text>
<path d="M 260 205 L 318 205" class="accent"/><polygon points="308,197 324,205 308,213" fill="#3B6FB6"/>
<rect x="326" y="145" width="220" height="118" rx="12" class="blue"/><text x="436" y="183" text-anchor="middle" font-weight="700">Patch tokens</text><text x="436" y="211" text-anchor="middle" class="small">visible patches only</text><text x="436" y="239" text-anchor="middle" class="small">position embeddings</text>
<path d="M 546 205 L 600 205" class="accent"/><polygon points="590,197 606,205 590,213" fill="#3B6FB6"/>
<rect x="608" y="145" width="200" height="118" rx="12" class="gold"/><text x="708" y="183" text-anchor="middle" font-weight="700">Mask tokens</text><text x="708" y="211" text-anchor="middle" class="small">inserted in decoder</text><text x="708" y="239" text-anchor="middle" class="small">predict hidden pixels</text>
<path d="M 808 205 L 862 205" class="accent"/><polygon points="852,197 868,205 852,213" fill="#3B6FB6"/>
<g transform="translate(885 145)"><rect x="0" y="0" width="168" height="118" rx="7" fill="#f3f6f8" stroke="#9cabb9" stroke-width="2"/><path d="M 42 0 V118 M84 0 V118 M126 0 V118 M0 29.5 H168 M0 59 H168 M0 88.5 H168" stroke="#c1cbd4" stroke-width="1.5"/><rect x="42" y="0" width="42" height="29.5" fill="#3B6FB6"/><rect x="126" y="0" width="42" height="29.5" fill="#3B6FB6"/><rect x="0" y="29.5" width="42" height="29.5" fill="#3B6FB6"/><rect x="84" y="29.5" width="42" height="29.5" fill="#3B6FB6"/><rect x="42" y="59" width="42" height="29.5" fill="#3B6FB6"/><rect x="126" y="59" width="42" height="29.5" fill="#3B6FB6"/><rect x="0" y="88.5" width="42" height="29.5" fill="#3B6FB6"/><rect x="84" y="88.5" width="42" height="29.5" fill="#3B6FB6"/></g>
<text x="969" y="292" text-anchor="middle" class="small">Compare predictions</text><text x="969" y="315" text-anchor="middle" class="small">with original patches</text>
<rect x="185" y="367" width="730" height="48" rx="8" class="red"/><text x="550" y="397" text-anchor="middle" class="small">Reconstruction loss is applied to the hidden patches, not the visible ones.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Three self-supervised pretext tasks</title><desc id="desc">Rotation prediction, jigsaw tile arrangement, and colorization use different automatically generated targets.</desc><rect width="1100" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20242a;font-size:20px}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#315f91}.small{font-size:16px;fill:#434b55}.tiny{font-size:15px;fill:#59616b}.card{fill:#fff;stroke:#a8b2be;stroke-width:2}.panel{fill:#f6f7f9;stroke:#c2cad3}.blue{fill:#eaf2fb;stroke:#3b6fb6;stroke-width:2}</style>
<text x="34" y="42" class="title">One observation, three different prediction targets</text>
<rect x="25" y="65" width="340" height="365" rx="12" class="card"/><rect x="380" y="65" width="340" height="365" rx="12" class="card"/><rect x="735" y="65" width="340" height="365" rx="12" class="card"/>
<text x="195" y="103" text-anchor="middle" class="head">Rotation prediction</text><text x="550" y="103" text-anchor="middle" class="head">Jigsaw prediction</text><text x="905" y="103" text-anchor="middle" class="head">Colorization</text>
<rect x="80" y="125" width="230" height="125" rx="8" class="panel"/><line x1="112" y1="222" x2="278" y2="222" stroke="#758394" stroke-width="3"/><rect x="160" y="195" width="78" height="23" rx="4" fill="#7f98b4" stroke="#315f91" stroke-width="2"/><circle cx="177" cy="225" r="8" fill="#fff" stroke="#59616b" stroke-width="3"/><circle cx="221" cy="225" r="8" fill="#fff" stroke="#59616b" stroke-width="3"/><line x1="200" y1="195" x2="217" y2="147" stroke="#46566a" stroke-width="8" stroke-linecap="round"/><circle cx="217" cy="147" r="7" fill="#d4a34c"/><path d="M 128 168 C 140 148 159 142 175 150" fill="none" stroke="#3b6fb6" stroke-width="2.5"/><path d="M 169 142 L 177 151 L 165 154" fill="none" stroke="#3b6fb6" stroke-width="2.5"/>
<rect x="65" y="267" width="260" height="52" rx="8" class="blue"/><text x="195" y="289" text-anchor="middle" font-weight="700">Predict the applied turn</text><text x="195" y="309" text-anchor="middle" class="small">0°, 90°, 180°, or 270°</text><text x="195" y="351" text-anchor="middle" class="tiny">Target: transformation label</text><text x="195" y="377" text-anchor="middle" class="tiny">Known because we rotate it</text>
<rect x="430" y="125" width="240" height="125" rx="8" class="panel"/><g stroke="#fff" stroke-width="3"><rect x="452" y="143" width="62" height="42" fill="#dfe8f3"/><rect x="516" y="143" width="62" height="42" fill="#9bb4d0"/><rect x="580" y="143" width="62" height="42" fill="#c7d3e1"/><rect x="452" y="187" width="62" height="42" fill="#9bb4d0"/><rect x="516" y="187" width="62" height="42" fill="#c7d3e1"/><rect x="580" y="187" width="62" height="42" fill="#dfe8f3"/></g><path d="M 450 237 L 644 237" stroke="#3b6fb6" stroke-width="2.5" stroke-dasharray="5 4"/>
<rect x="420" y="267" width="260" height="52" rx="8" class="blue"/><text x="550" y="289" text-anchor="middle" font-weight="700">Recover tile order</text><text x="550" y="309" text-anchor="middle" class="small">from a shuffled grid</text><text x="550" y="351" text-anchor="middle" class="tiny">Target: spatial arrangement</text><text x="550" y="377" text-anchor="middle" class="tiny">Tile permutation is known</text>
<rect x="785" y="125" width="240" height="125" rx="8" class="panel"/><rect x="802" y="143" width="92" height="88" rx="6" fill="#e2e4e7" stroke="#aab2bc"/><rect x="916" y="143" width="92" height="88" rx="6" fill="#eaf2fb" stroke="#aab2bc"/><circle cx="848" cy="175" r="14" fill="#b7bbc0"/><path d="M 815 218 Q 848 186 881 218" fill="#b7bbc0"/><circle cx="962" cy="175" r="14" fill="#e2b45e"/><path d="M 929 218 Q 962 186 995 218" fill="#6e98c5"/><path d="M 895 187 L 912 187" stroke="#697789" stroke-width="2.5"/><path d="M 905 180 L 913 187 L 905 194" fill="none" stroke="#697789" stroke-width="2.5"/>
<rect x="775" y="267" width="260" height="52" rx="8" class="blue"/><text x="905" y="289" text-anchor="middle" font-weight="700">Predict color channels</text><text x="905" y="309" text-anchor="middle" class="small">from grayscale pixels</text><text x="905" y="351" text-anchor="middle" class="tiny">Target: visual appearance</text><text x="905" y="377" text-anchor="middle" class="tiny">Colors come from the source</text></svg>
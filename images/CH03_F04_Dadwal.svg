<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Three ways to create a learning target from one observation</title><desc id="desc">Original schematic for a technical chapter on self-supervised representation learning.</desc><rect width="1100" height="450" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:22px}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#3B6FB6}.small{font-size:18px;fill:#444}.tiny{font-size:16px;fill:#555}.card{fill:#fff;stroke:#aab5c2;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3B6FB6;stroke-width:2}.gold{fill:#fff3d8;stroke:#b8862d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.line{stroke:#596b7c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#3B6FB6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b98a6;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="40" y="42" class="title">One source observation, three different targets</text>
<rect x="30" y="68" width="330" height="340" rx="14" class="card"/><rect x="385" y="68" width="330" height="340" rx="14" class="card"/><rect x="740" y="68" width="330" height="340" rx="14" class="card"/>
<text x="195" y="108" text-anchor="middle" class="head">Rotation prediction</text><text x="550" y="108" text-anchor="middle" class="head">Colorization</text><text x="905" y="108" text-anchor="middle" class="head">Future-frame prediction</text>
<rect x="87" y="135" width="216" height="124" rx="8" fill="#f5f6f7" stroke="#c8d0d8"/><rect x="442" y="135" width="216" height="124" rx="8" fill="#ededed" stroke="#c8d0d8"/><rect x="797" y="135" width="216" height="124" rx="8" fill="#f5f6f7" stroke="#c8d0d8"/>
<g transform="translate(192 201) scale(0.8)"><line x1="-56" y1="53" x2="65" y2="53" stroke="#697989" stroke-width="3"/><rect x="-30" y="24" width="57" height="24" rx="4" fill="#8c9cab" stroke="#254f7f" stroke-width="2"/><circle cx="-16" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><circle cx="15" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><g transform="rotate(-7 -1 26)"><line x1="-1" y1="26" x2="7" y2="-47" stroke="#3b4e60" stroke-width="8" stroke-linecap="round"/><circle cx="7" cy="-47" r="8" fill="#d99b40" stroke="#77521b" stroke-width="2"/></g></g><g transform="translate(547 201) scale(0.8)"><line x1="-56" y1="53" x2="65" y2="53" stroke="#697989" stroke-width="3"/><rect x="-30" y="24" width="57" height="24" rx="4" fill="#8c9cab" stroke="#254f7f" stroke-width="2"/><circle cx="-16" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><circle cx="15" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><g transform="rotate(6 -1 26)"><line x1="-1" y1="26" x2="7" y2="-47" stroke="#3b4e60" stroke-width="8" stroke-linecap="round"/><circle cx="7" cy="-47" r="8" fill="#d99b40" stroke="#77521b" stroke-width="2"/></g></g><g transform="translate(902 201) scale(0.8)"><line x1="-56" y1="53" x2="65" y2="53" stroke="#697989" stroke-width="3"/><rect x="-30" y="24" width="57" height="24" rx="4" fill="#8c9cab" stroke="#254f7f" stroke-width="2"/><circle cx="-16" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><circle cx="15" cy="52" r="8" fill="#fff" stroke="#42566b" stroke-width="3"/><g transform="rotate(-15 -1 26)"><line x1="-1" y1="26" x2="7" y2="-47" stroke="#3b4e60" stroke-width="8" stroke-linecap="round"/><circle cx="7" cy="-47" r="8" fill="#d99b40" stroke="#77521b" stroke-width="2"/></g></g>
<path d="M 195 268 L 195 298" class="accent"/><path d="M 550 268 L 550 298" class="accent"/><path d="M 905 268 L 905 298" class="accent"/>
<rect x="72" y="301" width="246" height="62" rx="9" class="blue"/><rect x="427" y="301" width="246" height="62" rx="9" class="blue"/><rect x="782" y="301" width="246" height="62" rx="9" class="blue"/>
<text x="195" y="326" text-anchor="middle" font-weight="700">Predict the angle label</text><text x="195" y="350" text-anchor="middle" class="small">e.g. 0°, 90°, 180°, 270°</text>
<text x="550" y="326" text-anchor="middle" font-weight="700">Predict pixel colors</text><text x="550" y="350" text-anchor="middle" class="small">from a grayscale image</text>
<text x="905" y="326" text-anchor="middle" font-weight="700">Predict a later image</text><text x="905" y="350" text-anchor="middle" class="small">from the current observation</text>
<text x="195" y="389" text-anchor="middle" class="tiny">Target: transformation</text><text x="550" y="389" text-anchor="middle" class="tiny">Target: appearance</text><text x="905" y="389" text-anchor="middle" class="tiny">Target: temporal change</text>
</svg>
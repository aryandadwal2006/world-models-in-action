<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#fff"/><text x="600" y="42" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#222">Same views, different objective mechanisms</text>
<text x="45" y="92" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">Method</text><text x="265" y="92" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">Representation path</text><text x="690" y="92" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">Training target</text><text x="1000" y="92" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">Extra constraint</text><line x1="35" y1="105" x2="1165" y2="105" stroke="#aaa"/>
<text x="45" y="147" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#222">SimCLR</text><rect x="240" y="118" width="145" height="50" rx="7" fill="#eaf0f8" stroke="#3B6FB6"/><text x="312" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Encoder + MLP</text><path d="M385 143 H445" stroke="#666" stroke-width="2"/><rect x="445" y="118" width="200" height="50" rx="7" fill="#f7f1e8" stroke="#b08b59"/><text x="545" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Candidate softmax</text><text x="690" y="147" font-family="Arial,sans-serif" font-size="15" fill="#333">Positive over negatives</text><text x="1000" y="147" font-family="Arial,sans-serif" font-size="15" fill="#333">Explicit negatives</text><line x1="35" y1="190" x2="1165" y2="190" stroke="#ddd"/>
<text x="45" y="232" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#222">BYOL / SimSiam</text><rect x="240" y="205" width="145" height="50" rx="7" fill="#eaf0f8" stroke="#3B6FB6"/><text x="312" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Online + predictor</text><path d="M385 230 H445" stroke="#666" stroke-width="2"/><rect x="445" y="205" width="200" height="50" rx="7" fill="#eef4ee" stroke="#668866"/><text x="545" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Detached target feature</text><text x="690" y="224" font-family="Arial,sans-serif" font-size="15" fill="#333">Target branch</text><text x="690" y="244" font-family="Arial,sans-serif" font-size="13" fill="#555">EMA for BYOL only</text><text x="1000" y="224" font-family="Arial,sans-serif" font-size="15" fill="#333">Stop-gradient</text><text x="1000" y="244" font-family="Arial,sans-serif" font-size="13" fill="#555">Predictor asymmetry</text><line x1="35" y1="276" x2="1165" y2="276" stroke="#ddd"/>
<text x="45" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#222">DINO</text><rect x="240" y="291" width="145" height="50" rx="7" fill="#eaf0f8" stroke="#3B6FB6"/><text x="312" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Student / teacher</text><path d="M385 316 H445" stroke="#666" stroke-width="2"/><rect x="445" y="291" width="200" height="50" rx="7" fill="#f7f1e8" stroke="#b08b59"/><text x="545" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Prototype distribution</text><text x="690" y="310" font-family="Arial,sans-serif" font-size="15" fill="#333">Teacher distribution</text><text x="690" y="330" font-family="Arial,sans-serif" font-size="13" fill="#555">Matched by cross-entropy</text><text x="1000" y="310" font-family="Arial,sans-serif" font-size="15" fill="#333">Centering / sharpening</text><text x="1000" y="330" font-family="Arial,sans-serif" font-size="13" fill="#555">EMA teacher</text><line x1="35" y1="362" x2="1165" y2="362" stroke="#ddd"/>
<text x="45" y="404" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#222">Barlow Twins</text><rect x="240" y="377" width="145" height="50" rx="7" fill="#eaf0f8" stroke="#3B6FB6"/><text x="312" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Paired embeddings</text><path d="M385 402 H445" stroke="#666" stroke-width="2"/><rect x="445" y="377" width="200" height="50" rx="7" fill="#eef4ee" stroke="#668866"/><text x="545" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Cross-correlation matrix</text><text x="690" y="396" font-family="Arial,sans-serif" font-size="15" fill="#333">Identity target</text><text x="690" y="416" font-family="Arial,sans-serif" font-size="13" fill="#555">diag = 1, off-diag = 0</text><text x="1000" y="396" font-family="Arial,sans-serif" font-size="15" fill="#333">Redundancy penalty</text><text x="1000" y="416" font-family="Arial,sans-serif" font-size="13" fill="#555">Batch statistics</text><line x1="35" y1="448" x2="1165" y2="448" stroke="#ddd"/>
<text x="45" y="490" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#222">VICReg</text><rect x="240" y="463" width="145" height="50" rx="7" fill="#eaf0f8" stroke="#3B6FB6"/><text x="312" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Paired embeddings</text><path d="M385 488 H445" stroke="#666" stroke-width="2"/><rect x="445" y="463" width="200" height="50" rx="7" fill="#eef4ee" stroke="#668866"/><text x="545" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#222">Three loss terms</text><text x="690" y="482" font-family="Arial,sans-serif" font-size="15" fill="#333">MSE invariance</text><text x="690" y="502" font-family="Arial,sans-serif" font-size="13" fill="#555">plus variance + covariance</text><text x="1000" y="482" font-family="Arial,sans-serif" font-size="15" fill="#333">Explicit variance floor</text><text x="1000" y="502" font-family="Arial,sans-serif" font-size="13" fill="#555">Off-diagonal covariance</text>
<rect x="55" y="550" width="1090" height="82" rx="8" fill="#f5f5f5" stroke="#999"/><text x="600" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#222">Same goal is not the same mechanism</text><text x="600" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#333">Negative sets, teacher targets and feature statistics constrain different parts of the learning problem.</text><text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">Schematic synthesized from method papers; simplified for comparison, not a full training graph.</text>
</svg>
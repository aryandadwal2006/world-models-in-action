<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65717D"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3B6FB6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}.r{fill:#F4F6F8;stroke:#AAB3BD;stroke-width:2}.br{fill:#EAF0F7;stroke:#3B6FB6;stroke-width:2.5}.ar{stroke:#65717D;stroke-width:3;fill:none;marker-end:url(#a)}.ba{stroke:#3B6FB6;stroke-width:3;fill:none;marker-end:url(#b)}</style>
<text x="550" y="60" font-size="24" fill="#242A31" text-anchor="middle">VISReg separates the scale gradient from the shape gradient</text>
<rect x="45" y="160" width="250" height="130" rx="12" class="r"/><text x="170" y="194" class="h" text-anchor="middle">Centered embeddings</text><text x="170" y="225" class="s" text-anchor="middle">Z − μ</text>
<rect x="425" y="160" width="250" height="130" rx="12" class="br"/><text x="550" y="194" class="h" text-anchor="middle">Scale statistic</text><text x="550" y="225" class="s" text-anchor="middle">σ(Z)</text><rect x="805" y="160" width="250" height="130" rx="12" class="br"/><text x="930" y="194" class="h" text-anchor="middle">Normalized shape</text><text x="930" y="225" class="s" text-anchor="middle">(Z − μ) / sg(σ)</text>
<path d="M295 225L425 225" class="ba"/><path d="M675 225L805 225" class="ba"/>
<path d="M550 290L550 370" class="ba"/><rect x="410" y="370" width="280" height="85" rx="12" class="r"/><text x="550" y="404" class="h" text-anchor="middle">Scale loss</text><text x="550" y="435" class="s" text-anchor="middle">updates σ</text>
<path d="M930 290L930 370" class="ba"/><rect x="790" y="370" width="280" height="85" rx="12" class="r"/><text x="930" y="404" class="h" text-anchor="middle">Shape loss</text><text x="930" y="435" class="s" text-anchor="middle">σ is detached</text>
<text x="550" y="490" font-size="18" fill="#65717D" text-anchor="middle">The detached denominator blocks the shape-loss gradient through the scale statistic.</text>
</svg>
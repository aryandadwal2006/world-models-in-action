<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65717D"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3B6FB6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}.r{fill:#F4F6F8;stroke:#AAB3BD;stroke-width:2}.br{fill:#EAF0F7;stroke:#3B6FB6;stroke-width:2.5}.ar{stroke:#65717D;stroke-width:3;fill:none;marker-end:url(#a)}.ba{stroke:#3B6FB6;stroke-width:3;fill:none;marker-end:url(#b)}</style>
<text x="550" y="60" font-size="24" fill="#242A31" text-anchor="middle">The optimum follows from two separate constraints</text>
<rect x="35" y="120" width="485" height="310" rx="12" class="br"/><text x="277.5" y="154" class="h" text-anchor="middle">Fixed covariance</text><text x="277.5" y="185" class="s" text-anchor="middle">Gaussian minimizes Fisher information</text>
<ellipse cx="275" cy="275" rx="150" ry="70" fill="#EAF0F7" stroke="#3B6FB6" stroke-width="2"/>
<path d="M135 275Q275 115 415 275Q275 435 135 275Z" fill="none" stroke="#65717D" stroke-width="2" stroke-dasharray="8 6"/>
<text x="275" y="455" font-size="18" fill="#65717D" text-anchor="middle">same Σ; different density shapes</text>
<rect x="580" y="120" width="485" height="310" rx="12" class="br"/><text x="822.5" y="154" class="h" text-anchor="middle">Fixed scalar covariance</text><text x="822.5" y="185" class="s" text-anchor="middle">isotropic covariance minimizes trace(Σ⁻¹)</text>
<circle cx="822" cy="275" r="125" fill="#EAF0F7" stroke="#3B6FB6" stroke-width="2"/>
<ellipse cx="822" cy="275" rx="185" ry="48" fill="none" stroke="#65717D" stroke-width="2" stroke-dasharray="8 6"/>
<text x="822" y="455" font-size="18" fill="#65717D" text-anchor="middle">equal eigenvalues at the optimum</text>
</svg>
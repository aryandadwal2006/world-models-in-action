<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">VL-JEPA cross-modal prediction pathways</title>
  <desc id="desc">Visual context and a textual query enter a predictor. The predictor estimates a text embedding, which is compared with an encoded target during training and optionally decoded into text at inference.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B6FB6"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#606A75"/></marker>
    <style>
      .box{fill:#FFFFFF;stroke:#3B6FB6;stroke-width:2.3;rx:12}
      .soft{fill:#EEF4FB;stroke:#3B6FB6;stroke-width:2.3;rx:12}
      .optional{fill:#FFFFFF;stroke:#606A75;stroke-width:2;stroke-dasharray:8 6;rx:12}
      .title{font:600 20px Arial,sans-serif;fill:#1E2935}
      .math{font:italic 22px Georgia,serif;fill:#1E2935}
      .small{font:15px Arial,sans-serif;fill:#495563}
      .tiny{font:13px Arial,sans-serif;fill:#606A75}
      .arrow{fill:none;stroke:#3B6FB6;stroke-width:2.5;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#606A75;stroke-width:2.1;stroke-dasharray:8 6;marker-end:url(#arrowGray);stroke-linecap:round;stroke-linejoin:round}
      .rule{stroke:#D8DEE7;stroke-width:1.5}
    </style>
  </defs>
  <rect x="12" y="12" width="1216" height="596" rx="18" fill="#FFFFFF"/>
  <text x="42" y="48" class="small" font-weight="700" letter-spacing="1.5">PREDICTION PATH</text>
  <line x1="42" y1="62" x2="1198" y2="62" class="rule"/>
  <rect x="42" y="100" width="185" height="105" class="box"/>
  <text x="134" y="140" text-anchor="middle" class="title">Visual input</text><text x="134" y="174" text-anchor="middle" class="math">X<tspan baseline-shift="sub" font-size="14">V</tspan></text>
  <rect x="294" y="100" width="190" height="105" class="soft"/>
  <text x="389" y="140" text-anchor="middle" class="title">X-Encoder</text><text x="389" y="174" text-anchor="middle" class="math">f<tspan baseline-shift="sub" font-size="14">θ</tspan></text>
  <rect x="552" y="100" width="190" height="105" class="box"/>
  <text x="647" y="140" text-anchor="middle" class="title">Visual features</text><text x="647" y="174" text-anchor="middle" class="math">S<tspan baseline-shift="sub" font-size="14">V</tspan></text>
  <rect x="552" y="270" width="190" height="92" class="box"/>
  <text x="647" y="308" text-anchor="middle" class="title">Text query</text><text x="647" y="340" text-anchor="middle" class="math">X<tspan baseline-shift="sub" font-size="14">Q</tspan></text>
  <rect x="825" y="180" width="190" height="125" class="soft"/>
  <text x="920" y="225" text-anchor="middle" class="title">Predictor</text><text x="920" y="260" text-anchor="middle" class="math">p<tspan baseline-shift="sub" font-size="14">ϕ</tspan>(S<tspan baseline-shift="sub" font-size="14">V</tspan>, X<tspan baseline-shift="sub" font-size="14">Q</tspan>)</text>
  <rect x="1075" y="180" width="145" height="125" class="box"/>
  <text x="1148" y="220" text-anchor="middle" class="title">Predicted</text><text x="1148" y="248" text-anchor="middle" class="title">text feature</text><text x="1148" y="281" text-anchor="middle" class="math">Ŝ<tspan baseline-shift="sub" font-size="14">Y</tspan></text>
  <path d="M227 152 H294" class="arrow"/><path d="M484 152 H552" class="arrow"/><path d="M742 152 H780 V220 H825" class="arrow"/><path d="M742 316 H780 V265 H825" class="arrow"/><path d="M1015 242 H1075" class="arrow"/>
  <text x="42" y="414" class="small" font-weight="700" letter-spacing="1.5">TARGET AND TRAINING LOSS</text><line x1="42" y1="428" x2="1198" y2="428" class="rule"/>
  <rect x="42" y="470" width="185" height="92" class="box"/>
  <text x="134" y="505" text-anchor="middle" class="title">Target text</text><text x="134" y="538" text-anchor="middle" class="math">Y</text>
  <rect x="294" y="470" width="190" height="92" class="soft"/>
  <text x="389" y="505" text-anchor="middle" class="title">Y-Encoder</text><text x="389" y="538" text-anchor="middle" class="math">e<tspan baseline-shift="sub" font-size="14">ψ</tspan></text>
  <rect x="552" y="470" width="190" height="92" class="box"/>
  <text x="647" y="505" text-anchor="middle" class="title">Target feature</text><text x="647" y="538" text-anchor="middle" class="math">S<tspan baseline-shift="sub" font-size="14">Y</tspan></text>
  <rect x="825" y="470" width="190" height="92" class="soft"/>
  <text x="920" y="505" text-anchor="middle" class="title">Bidirectional</text><text x="920" y="538" text-anchor="middle" class="title">InfoNCE loss</text>
  <path d="M227 516 H294" class="arrow"/><path d="M484 516 H552" class="arrow"/><path d="M742 516 H825" class="arrow"/><path d="M1148 305 V390 H1015 V470" class="arrow"/>
  <rect x="1075" y="470" width="145" height="92" class="optional"/>
  <text x="1148" y="503" text-anchor="middle" class="title">Optional</text><text x="1148" y="527" text-anchor="middle" class="small">decode or</text><text x="1148" y="548" text-anchor="middle" class="small">match candidates</text>
  <path d="M1148 305 V350 H1148 V470" class="dash"/>
  <text x="42" y="590" class="tiny">Solid paths: embedding prediction and training. Dashed path: optional inference-time decoding or candidate matching.</text>
</svg>
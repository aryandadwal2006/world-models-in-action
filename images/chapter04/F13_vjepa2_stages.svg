<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Original explanatory figure for Chapter 4"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#65717D"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#3B6FB6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}.r{fill:#F4F6F8;stroke:#AAB3BD;stroke-width:2}.br{fill:#EAF0F7;stroke:#3B6FB6;stroke-width:2.5}.ar{stroke:#65717D;stroke-width:3;fill:none;marker-end:url(#a)}.ba{stroke:#3B6FB6;stroke-width:3;fill:none;marker-end:url(#b)}</style>
<rect x="30" y="115" width="300" height="285" rx="12" class="br"/><text class="h" x="180" y="149" text-anchor="middle">Stage A: passive pretraining</text><text class="s" x="180" y="180" text-anchor="middle">images + video; no action input</text>
<rect x="400" y="115" width="300" height="285" rx="12" class="br"/><text class="h" x="550" y="149" text-anchor="middle">Stage B: robot post-training</text><text class="s" x="550" y="180" text-anchor="middle">video + action + proprioception</text>
<rect x="770" y="115" width="300" height="285" rx="12" class="r"/><text class="h" x="920" y="149" text-anchor="middle">Stage C: planning</text><text class="s" x="920" y="180" text-anchor="middle">goal features + candidate controls</text>
<text x="180" y="245" font-size="23" fill="#3B6FB6" text-anchor="middle">Visual encoder</text><text x="180" y="290" font-size="19" fill="#65717D" text-anchor="middle">masked feature loss</text>
<text x="550" y="245" font-size="21" fill="#3B6FB6" text-anchor="middle">Frozen encoder</text><text x="550" y="290" font-size="19" fill="#65717D" text-anchor="middle">action-conditioned predictor</text>
<text x="920" y="245" font-size="23" fill="#3B6FB6" text-anchor="middle">CEM / MPC</text><text x="920" y="290" font-size="19" fill="#65717D" text-anchor="middle">execute and replan</text>
<path d="M330 255 L400 255" class="ba" /><path d="M700 255 L770 255" class="ba" />
<text x="550" y="460" font-size="18" fill="#65717D" text-anchor="middle">Robot-control evidence belongs to the staged system, not passive pretraining alone.</text>
</svg>
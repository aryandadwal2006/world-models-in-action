<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65717D"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3B6FB6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}.r{fill:#F4F6F8;stroke:#AAB3BD;stroke-width:2}.br{fill:#EAF0F7;stroke:#3B6FB6;stroke-width:2.5}.ar{stroke:#65717D;stroke-width:3;fill:none;marker-end:url(#a)}.ba{stroke:#3B6FB6;stroke-width:3;fill:none;marker-end:url(#b)}</style>
<text x="550" y="55" font-size="23" fill="#242A31" text-anchor="middle">The training graph separates forward computation, loss and target update</text>
<rect x="20" y="160" width="155" height="110" rx="12" class="br"/><text x="97.5" y="194" class="h" text-anchor="middle">Image batch</text><text x="97.5" y="225" class="s" text-anchor="middle">B × C × H × W</text><rect x="215" y="160" width="175" height="110" rx="12" class="r"/><text x="302.5" y="194" class="h" text-anchor="middle">Patch embed</text><text x="302.5" y="225" class="s" text-anchor="middle">B × N × D</text><rect x="440" y="80" width="200" height="110" rx="12" class="br"/><text x="540" y="114" class="h" text-anchor="middle">Context encoder</text><text x="540" y="145" class="s" text-anchor="middle">B × N꜀ × D</text><rect x="440" y="300" width="200" height="110" rx="12" class="r"/><text x="540" y="334" class="h" text-anchor="middle">Target encoder</text><text x="540" y="365" class="s" text-anchor="middle">B × N × D</text>
<path d="M175 210L215 210" class="ba"/><path d="M390 210L440 135" class="ba"/><path d="M390 210L440 355" class="ar"/>
<rect x="700" y="80" width="170" height="110" rx="12" class="br"/><text x="785" y="114" class="h" text-anchor="middle">Predictor</text><text x="785" y="145" class="s" text-anchor="middle">context + queries</text><rect x="700" y="300" width="170" height="110" rx="12" class="r"/><text x="785" y="334" class="h" text-anchor="middle">Select targets</text><text x="785" y="365" class="s" text-anchor="middle">B × Nᵢ × D</text><path d="M640 135L700 135" class="ba"/><path d="M640 355L700 355" class="ar"/>
<rect x="920" y="180" width="160" height="115" rx="12" class="r"/><text x="1000" y="214" class="h" text-anchor="middle">Loss</text><text x="1000" y="245" class="s" text-anchor="middle">feature distance</text><path d="M870 135L920 210" class="ba"/><path d="M870 355L920 270" class="ar"/>
<text x="550" y="465" font-size="18" fill="#65717D" text-anchor="middle">EMA updates target parameters after the optimizer step; it is not a loss-gradient path.</text>

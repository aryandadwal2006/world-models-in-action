<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}</style><text x="550" y="65" text-anchor="middle" class="h">A JEPA specifies context, target and query as separate inputs</text><rect x="40" y="200" width="210" height="115" rx="12" fill="#EAF0F7" stroke="#3B6FB6" stroke-width="2.5"/><text x="145" y="245" text-anchor="middle" class="h">Context X</text><text x="145" y="280" text-anchor="middle" class="s">available information</text><rect x="40" y="365" width="210" height="90" rx="12" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="145" y="405" text-anchor="middle" class="h">Query Q</text><text x="145" y="435" text-anchor="middle" class="s">where / what to predict</text><rect x="350" y="245" width="235" height="115" rx="12" fill="#EAF0F7" stroke="#3B6FB6" stroke-width="2.5"/><text x="467" y="290" text-anchor="middle" class="h">Predictor gϕ</text><text x="467" y="325" text-anchor="middle" class="s">maps context to query</text><rect x="700" y="245" width="165" height="115" rx="12" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="782" y="290" text-anchor="middle" class="h">Predicted</text><text x="782" y="325" text-anchor="middle" class="s">feature ŜY</text><rect x="900" y="245" width="165" height="115" rx="12" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="982" y="290" text-anchor="middle" class="h">Target</text><text x="982" y="325" text-anchor="middle" class="s">feature SY</text><path d="M250 255 L350 285 M250 410 L350 330 M585 300 L700 300 M865 300 L900 300" fill="none" stroke="#3B6FB6" stroke-width="3"/><path d="M865 360 L865 420 L982 420 L982 360" fill="none" stroke="#65717D" stroke-width="2" stroke-dasharray="7 6"/><text x="550" y="475" text-anchor="middle" class="s">The target branch defines the reference feature; it is not necessarily observed by the predictor.</text></svg>
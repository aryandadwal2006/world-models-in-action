<text x="550" y="65" font-size="24" fill="#242A31" text-anchor="middle">A spatial block repeated through time forms a target tube</text>
<rect x="70" y="130" width="215" height="250" rx="8" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="177" y="115" font-size="18" fill="#65717D" text-anchor="middle">frame 1</text><rect x="177" y="230" width="82" height="90" rx="4" fill="#3B6FB6" opacity=".82"/><rect x="315" y="130" width="215" height="250" rx="8" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="422" y="115" font-size="18" fill="#65717D" text-anchor="middle">frame 2</text><rect x="422" y="230" width="82" height="90" rx="4" fill="#3B6FB6" opacity=".82"/><rect x="560" y="130" width="215" height="250" rx="8" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="667" y="115" font-size="18" fill="#65717D" text-anchor="middle">frame 3</text><rect x="667" y="230" width="82" height="90" rx="4" fill="#3B6FB6" opacity=".82"/><rect x="805" y="130" width="215" height="250" rx="8" fill="#F4F6F8" stroke="#AAB3BD" stroke-width="2"/><text x="912" y="115" font-size="18" fill="#65717D" text-anchor="middle">frame 4</text><rect x="912" y="230" width="82" height="90" rx="4" fill="#3B6FB6" opacity=".82"/>
<text x="550" y="445" font-size="18" fill="#65717D" text-anchor="middle">A standard multi-block mask may use context from later frames too; it is not inherently causal.</text>

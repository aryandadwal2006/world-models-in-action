<rect x="410" y="245" width="270" height="100" rx="12" class="r"/><text class="h" x="545" y="279" text-anchor="middle">World Model + Cost</text><text class="s" x="545" y="310" text-anchor="middle">imagine and evaluate</text><rect x="800" y="155" width="270" height="130" rx="12" class="br"/><text class="h" x="935" y="189" text-anchor="middle">Selected action</text><text class="s" x="935" y="220" text-anchor="middle">execute in environment</text>

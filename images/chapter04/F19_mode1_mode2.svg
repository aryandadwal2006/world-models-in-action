<text x="365" y="420" font-size="18" fill="#3B6FB6" text-anchor="middle">planner-generated action</text><text x="730" y="420" font-size="18" fill="#3B6FB6" text-anchor="middle">distilled policy</text><text x="550" y="475" font-size="18" fill="#65717D" text-anchor="middle">Mode 2 can teach; Mode 1 can make repeated decisions cheaply.</text>

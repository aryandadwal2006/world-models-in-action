<text x="550" y="95" font-size="21" fill="#242A31" text-anchor="middle">All one-dimensional directions identify the distribution (Cramér–Wold).</text>
<text x="550" y="385" font-size="19" fill="#3B6FB6" text-anchor="middle">A finite random set is a sketch; directions are resampled across training.</text><text x="550" y="450" font-size="18" fill="#65717D" text-anchor="middle">A minibatch statistic is not an exact population certificate.</text>

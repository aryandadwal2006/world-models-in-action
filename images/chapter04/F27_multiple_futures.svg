<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65717D"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3B6FB6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}.r{fill:#F4F6F8;stroke:#AAB3BD;stroke-width:2}.br{fill:#EAF0F7;stroke:#3B6FB6;stroke-width:2.5}.ar{stroke:#65717D;stroke-width:3;fill:none;marker-end:url(#a)}.ba{stroke:#3B6FB6;stroke-width:3;fill:none;marker-end:url(#b)}</style>
<text x="550" y="65" font-size="24" fill="#242A31" text-anchor="middle">One history and action can admit several possible futures</text>
<rect x="40" y="215" width="220" height="100" rx="12" class="br"/><text x="150" y="249" class="h" text-anchor="middle">History + action</text><text x="150" y="280" class="s" text-anchor="middle">shared condition</text><path d="M260 265L390 265" class="ba"/>
<path d="M390 265L500 150" class="ba"/><path d="M390 265L500 265" class="ba"/><path d="M390 265L500 380" class="ba"/>
<rect x="500" y="100" width="260" height="90" rx="12" class="r"/><text x="630" y="134" class="h" text-anchor="middle">Future 1</text><text x="630" y="165" class="s" text-anchor="middle">object moves left</text><rect x="500" y="220" width="260" height="90" rx="12" class="r"/><text x="630" y="254" class="h" text-anchor="middle">Future 2</text><text x="630" y="285" class="s" text-anchor="middle">object stays in place</text><rect x="500" y="340" width="260" height="90" rx="12" class="r"/><text x="630" y="374" class="h" text-anchor="middle">Future 3</text><text x="630" y="405" class="s" text-anchor="middle">object moves right</text>
<path d="M760 145L865 265" class="ar"/><path d="M760 265L865 265" class="ar"/><path d="M760 385L865 265" class="ar"/><rect x="865" y="215" width="205" height="100" rx="12" class="br"/><text x="967.5" y="249" class="h" text-anchor="middle">Cost / selection</text><text x="967.5" y="280" class="s" text-anchor="middle">rank alternatives</text>
<text x="550" y="480" font-size="18" fill="#65717D" text-anchor="middle">A single conditional mean can conceal mutually exclusive outcomes.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Original explanatory figure for Chapter 4"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#65717D"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#3B6FB6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242A31}.h{font-size:22px;font-weight:700}.s{font-size:18px;fill:#65717D}.r{fill:#F4F6F8;stroke:#AAB3BD;stroke-width:2}.br{fill:#EAF0F7;stroke:#3B6FB6;stroke-width:2.5}.ar{stroke:#65717D;stroke-width:3;fill:none;marker-end:url(#a)}.ba{stroke:#3B6FB6;stroke-width:3;fill:none;marker-end:url(#b)}</style>
<text x="550" y="55" font-size="24" fill="#242A31" text-anchor="middle">Six top-level modules organize the predictive agent</text>
<rect x="45" y="105" width="240" height="100" rx="12" class="br"/><text class="h" x="165" y="139" text-anchor="middle">Perception</text><text class="s" x="165" y="170" text-anchor="middle">sensory state</text><rect x="430" y="105" width="240" height="100" rx="12" class="br"/><text class="h" x="550" y="139" text-anchor="middle">World Model</text><text class="s" x="550" y="170" text-anchor="middle">imagined futures</text><rect x="815" y="105" width="240" height="100" rx="12" class="r"/><text class="h" x="935" y="139" text-anchor="middle">Cost</text><text class="s" x="935" y="170" text-anchor="middle">score predicted states</text>
<rect x="45" y="275" width="240" height="100" rx="12" class="r"/><text class="h" x="165" y="309" text-anchor="middle">Short-Term Memory</text><text class="s" x="165" y="340" text-anchor="middle">associative retrieval</text><rect x="430" y="275" width="240" height="100" rx="12" class="r"/><text class="h" x="550" y="309" text-anchor="middle">Actor</text><text class="s" x="550" y="340" text-anchor="middle">propose and select actions</text><rect x="815" y="275" width="240" height="100" rx="12" class="br"/><text class="h" x="935" y="309" text-anchor="middle">Configurator</text><text class="s" x="935" y="340" text-anchor="middle">adapt modules</text>
<path d="M285 155 L430 155" class="ba" /><path d="M670 155 L815 155" class="ba" /><path d="M815 325 L670 325" class="ar" /><rect x="815" y="405" width="240" height="85" rx="12" class="r"/><text class="h" x="935" y="439" text-anchor="middle">Intrinsic Cost + Critic</text><text class="s" x="935" y="470" text-anchor="middle">submodules within Cost</text>
<path d="M935 375 L935 405" class="ar" /><text x="550" y="485" font-size="18" fill="#65717D" text-anchor="middle">The physical environment remains outside the differentiable model graph.</text>
</svg>
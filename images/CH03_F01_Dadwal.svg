<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Self-supervised objectives grouped by training signal</title>
<desc id="desc">Five overlapping families of self-supervised learning: pretext prediction, contrastive learning, joint embedding, masked prediction, and cross-modal alignment. Representative examples are listed beneath each family.</desc>
<defs>
  <style>
    .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #142433; }
    .note { font: 400 27px Arial, Helvetica, sans-serif; fill: #536273; }
    .root-text { font: 700 35px Arial, Helvetica, sans-serif; fill: #142433; }
    .family { font: 700 32px Arial, Helvetica, sans-serif; fill: #142433; }
    .method { font: 600 32px Arial, Helvetica, sans-serif; fill: #223345; }
    .small { font: 400 27px Arial, Helvetica, sans-serif; fill: #46586a; }
    .root { fill: #eaf0f7; stroke: #3b6fb6; stroke-width: 3; }
    .familybox { fill: #f5f7fa; stroke: #526579; stroke-width: 2; }
    .leaf { fill: #fff; stroke: #9aa8b7; stroke-width: 1.8; }
    .wire { fill: none; stroke: #68798b; stroke-width: 2.4; }
  </style>
</defs>
<rect width="1600" height="600" fill="#ffffff"/>
<text class="title" x="800" y="39" text-anchor="middle">Organizing self-supervised objectives by training signal</text>
<text class="note" x="800" y="70" text-anchor="middle">Representative examples; methods can belong to more than one family</text>

<rect class="root" x="470" y="88" width="660" height="58" rx="12"/>
<text class="root-text" x="800" y="126" text-anchor="middle">Self-supervised representation learning</text>

<path class="wire" d="M800 146 V164 H170 M485 164 H1430"/>
<path class="wire" d="M170 164 V180 M485 164 V180 M800 164 V180 M1115 164 V180 M1430 164 V180"/>
<path class="wire" d="M170 235 V247 M170 300 V309 M170 362 V371 M170 424 V449"/>
<path class="wire" d="M485 235 V247 M485 300 V309 M485 362 V371 M485 424 V449"/>
<path class="wire" d="M800 235 V247 M800 300 V309 M800 362 V371 M800 424 V449"/>
<path class="wire" d="M1115 235 V247 M1115 300 V309 M1115 362 V371 M1115 424 V449"/>
<path class="wire" d="M1430 235 V247 M1430 300 V309 M1430 362 V371 M1430 424 V449"/>

<rect class="familybox" x="25" y="180" width="290" height="55" rx="9"/>
<text class="family" x="170" y="216" text-anchor="middle">Pretext prediction</text>
<rect class="leaf" x="25" y="247" width="290" height="53" rx="7"/>
<text class="method" x="170" y="281" text-anchor="middle">Rotation</text>
<rect class="leaf" x="25" y="309" width="290" height="53" rx="7"/>
<text class="method" x="170" y="343" text-anchor="middle">Jigsaw</text>
<rect class="leaf" x="25" y="371" width="290" height="53" rx="7"/>
<text class="method" x="170" y="405" text-anchor="middle">Colorization</text>

<rect class="familybox" x="340" y="180" width="290" height="55" rx="9"/>
<text class="family" x="485" y="216" text-anchor="middle">Contrastive</text>
<rect class="leaf" x="340" y="247" width="290" height="53" rx="7"/>
<text class="method" x="485" y="281" text-anchor="middle">SimCLR / NT-Xent</text>
<rect class="leaf" x="340" y="309" width="290" height="53" rx="7"/>
<text class="method" x="485" y="343" text-anchor="middle">MoCo</text>
<rect class="leaf" x="340" y="371" width="290" height="53" rx="7"/>
<text class="method" x="485" y="405" text-anchor="middle">CPC</text>

<rect class="familybox" x="655" y="180" width="290" height="55" rx="9"/>
<text class="family" x="800" y="216" text-anchor="middle">Joint embedding</text>
<rect class="leaf" x="655" y="247" width="290" height="53" rx="7"/>
<text class="method" x="800" y="281" text-anchor="middle">SimSiam</text>
<rect class="leaf" x="655" y="309" width="290" height="53" rx="7"/>
<text class="method" x="800" y="343" text-anchor="middle">BYOL / DINO</text>
<rect class="leaf" x="655" y="371" width="290" height="53" rx="7"/>
<text class="method" x="800" y="405" text-anchor="middle">Barlow / VICReg</text>

<rect class="familybox" x="970" y="180" width="290" height="55" rx="9"/>
<text class="family" x="1115" y="216" text-anchor="middle">Masked prediction</text>
<rect class="leaf" x="970" y="247" width="290" height="53" rx="7"/>
<text class="method" x="1115" y="281" text-anchor="middle">MAE / SimMIM</text>

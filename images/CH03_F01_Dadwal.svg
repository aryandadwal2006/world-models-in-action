<rect class="leaf" x="970" y="371" width="290" height="53" rx="7"/>
<text class="method" x="1115" y="405" text-anchor="middle" font-size="29">I-JEPA / V-JEPA 2</text>

<rect class="familybox" x="1285" y="180" width="290" height="55" rx="9"/>
<text class="family" x="1430" y="216" text-anchor="middle">Cross-modal</text>
<rect class="leaf" x="1285" y="247" width="290" height="53" rx="7"/>
<text class="method" x="1430" y="281" text-anchor="middle">CLIP</text>
<rect class="leaf" x="1285" y="309" width="290" height="53" rx="7"/>
<text class="method" x="1430" y="343" text-anchor="middle">ImageBind</text>
<rect class="leaf" x="1285" y="371" width="290" height="53" rx="7"/>
<text class="method" x="1430" y="405" text-anchor="middle">Video-text</text>

<rect x="40" y="462" width="1520" height="68" rx="9" fill="#f8fafc" stroke="#c6ced7" stroke-width="1.6"/>
<text class="small" x="800" y="490" text-anchor="middle">CPC is temporal and contrastive; collapse remedies can span families.</text>
<text class="small" x="800" y="518" text-anchor="middle">The useful question is what each objective rewards the encoder for preserving.</text>
</svg>
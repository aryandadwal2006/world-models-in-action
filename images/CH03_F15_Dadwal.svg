<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Contrastive predictive coding predicts a future latent</title><desc id="desc">Original schematic for a technical chapter on self-supervised representation learning.</desc><rect width="1100" height="450" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:22px}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#3B6FB6}.small{font-size:18px;fill:#444}.tiny{font-size:16px;fill:#555}.card{fill:#fff;stroke:#aab5c2;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3B6FB6;stroke-width:2}.gold{fill:#fff3d8;stroke:#b8862d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.green{fill:#e9f5ed;stroke:#43825c;stroke-width:2}.line{stroke:#596b7c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#3B6FB6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b98a6;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="40" y="42" class="title">CPC uses the encoded past to score candidate future latents</text>
<text x="65" y="88" class="head">Observed sequence</text>
<g transform="translate(65 118)"><rect x="0" y="0" width="135" height="95" rx="8" class="card"/><rect x="145" y="0" width="135" height="95" rx="8" class="card"/><rect x="290" y="0" width="135" height="95" rx="8" class="card"/><text x="67" y="41" text-anchor="middle" class="small">frame t−2</text><text x="212" y="41" text-anchor="middle" class="small">frame t−1</text><text x="357" y="41" text-anchor="middle" class="small">frame t</text><text x="67" y="70" text-anchor="middle" class="tiny">xₜ₋₂</text><text x="212" y="70" text-anchor="middle" class="tiny">xₜ₋₁</text><text x="357" y="70" text-anchor="middle" class="tiny">xₜ</text></g>
<path d="M 495 164 L 545 164" class="accent"/><polygon points="535,156 551,164 535,172" fill="#3B6FB6"/>
<rect x="555" y="119" width="180" height="90" rx="10" class="blue"/><text x="645" y="154" text-anchor="middle" font-weight="700">Encoder + GRU</text><text x="645" y="183" text-anchor="middle" class="small">context cₜ</text>
<path d="M 735 164 L 785 164" class="accent"/><polygon points="775,156 791,164 775,172" fill="#3B6FB6"/>
<rect x="795" y="119" width="235" height="90" rx="10" class="gold"/><text x="912" y="154" text-anchor="middle" font-weight="700">Horizon predictor</text><text x="912" y="183" text-anchor="middle" class="small">score at horizon k</text>
<text x="65" y="263" class="head">Candidate latents at t + k</text>
<rect x="65" y="285" width="250" height="67" rx="9" class="green"/><text x="190" y="311" text-anchor="middle" font-weight="700">Positive</text><text x="190" y="336" text-anchor="middle" class="small">correct future zₜ₊ₖ</text>
<rect x="342" y="285" width="250" height="67" rx="9" class="red"/><text x="467" y="311" text-anchor="middle" font-weight="700">Negative</text><text x="467" y="336" text-anchor="middle" class="small">another sequence</text>
<rect x="619" y="285" width="250" height="67" rx="9" class="red"/><text x="744" y="311" text-anchor="middle" font-weight="700">Negative</text><text x="744" y="336" text-anchor="middle" class="small">another sequence</text>
<path d="M 912 209 C 900 248 680 255 230 280" class="accent"/><path d="M 912 209 C 900 248 480 255 470 280" class="dash"/><path d="M 912 209 C 920 250 755 255 745 280" class="dash"/>
<text x="905" y="316" class="tiny">...</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Using a learned encoder in a control loop</title><desc id="desc">Original schematic for a technical chapter on self-supervised representation learning.</desc><rect width="1100" height="450" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:22px}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#3B6FB6}.small{font-size:18px;fill:#444}.tiny{font-size:16px;fill:#555}.card{fill:#fff;stroke:#aab5c2;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3B6FB6;stroke-width:2}.gold{fill:#fff3d8;stroke:#b8862d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.green{fill:#e9f5ed;stroke:#43825c;stroke-width:2}.line{stroke:#596b7c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#3B6FB6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b98a6;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="40" y="42" class="title">The encoder is one component in a larger control loop</text>
<rect x="35" y="132" width="188" height="100" rx="12" class="card"/><text x="129" y="169" text-anchor="middle" class="head">Observation</text><text x="129" y="198" text-anchor="middle" class="small">image oₜ</text>
<rect x="283" y="132" width="188" height="100" rx="12" class="blue"/><text x="377" y="169" text-anchor="middle" class="head">Encoder</text><text x="377" y="198" text-anchor="middle" class="small">latent zₜ</text>
<rect x="531" y="132" width="188" height="100" rx="12" class="gold"/><text x="625" y="169" text-anchor="middle" class="head">Policy / planner</text><text x="625" y="198" text-anchor="middle" class="small">choose action aₜ</text>
<rect x="779" y="132" width="188" height="100" rx="12" class="green"/><text x="873" y="169" text-anchor="middle" class="head">Environment</text><text x="873" y="198" text-anchor="middle" class="small">state evolves</text>
<path d="M 223 182 L 277 182" class="accent"/><polygon points="267,174 283,182 267,190" fill="#3B6FB6"/><path d="M 471 182 L 525 182" class="accent"/><polygon points="515,174 531,182 515,190" fill="#3B6FB6"/><path d="M 719 182 L 773 182" class="accent"/><polygon points="763,174 779,182 763,190" fill="#3B6FB6"/>
<path d="M 873 232 L 873 301 L 129 301 L 129 238" class="line"/><polygon points="121,248 129,232 137,248" fill="#596b7c"/>
<text x="502" y="287" text-anchor="middle" class="small">next observation oₜ₊₁</text>
<rect x="210" y="355" width="680" height="54" rx="9" class="red"/><text x="550" y="378" text-anchor="middle" font-weight="700">The encoder does not itself choose actions or plan.</text><text x="550" y="399" text-anchor="middle" class="small">A full world model also needs transition prediction and a way to evaluate futures.</text>
</svg>
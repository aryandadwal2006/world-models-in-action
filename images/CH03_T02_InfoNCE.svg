<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
<rect width="1200" height="540" fill="#ffffff"/><text x="600" y="42" font-family="Georgia,serif" font-size="27" text-anchor="middle" fill="#222">InfoNCE is candidate classification</text>
<rect x="42" y="90" width="180" height="78" rx="10" fill="#eaf0f8" stroke="#3B6FB6" stroke-width="2"/><text x="132" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#222">Anchor zᵢ</text><text x="132" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">view of xᵢ</text>
<path d="M222 129 H270 V107 H315 M270 129 V192 H315 M270 192 V277 H315" stroke="#666" stroke-width="2" fill="none"/>
<rect x="315" y="78" width="245" height="58" rx="8" fill="#eef4ee" stroke="#668866" stroke-width="2"/><text x="437" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#222">Positive zₚ(i)</text><text x="437" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">other view of same source</text>
<rect x="315" y="164" width="245" height="58" rx="8" fill="#f5f5f5" stroke="#999"/><text x="437" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#222">Negative zₖ₁</text>
<rect x="315" y="250" width="245" height="58" rx="8" fill="#f5f5f5" stroke="#999"/><text x="437" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#222">Negative zₖ₂ …</text>
<path d="M560 107 H620 V182 H660 M560 193 H620 M560 279 H620 V209 H660" fill="none" stroke="#666" stroke-width="2"/>
<rect x="660" y="152" width="210" height="86" rx="10" fill="#eaf0f8" stroke="#3B6FB6" stroke-width="2"/><text x="765" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#222">Similarity / τ</text><text x="765" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">logits over candidates</text><text x="765" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">softmax</text>
<path d="M870 195 H920" stroke="#666" stroke-width="2"/><rect x="920" y="142" width="240" height="106" rx="10" fill="#f7f1e8" stroke="#b08b59" stroke-width="2"/><text x="1040" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#222">Cross-entropy</text><text x="1040" y="202" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#222">−log qᵢ,p(i)</text><text x="1040" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#444">raise positive rank</text>
<rect x="130" y="365" width="940" height="98" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="600" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#222">Gradient with respect to candidate logit aᵢⱼ</text><text x="390" y="426" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#222">positive: qᵢ,p(i) − 1</text><text x="790" y="426" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#222">negative: qᵢⱼ</text><text x="600" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">Hard negatives receive larger gradients because their softmax probabilities are larger.</text>
<text x="600" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">Batch construction defines the pair labels; semantic mistakes can enter through sampling.</text>
</svg>
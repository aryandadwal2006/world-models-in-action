<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Different methods prevent collapse in different ways</title><desc id="desc">Original schematic for a technical chapter on self-supervised representation learning.</desc><rect width="1100" height="450" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:22px}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700;fill:#3B6FB6}.small{font-size:18px;fill:#444}.tiny{font-size:16px;fill:#555}.card{fill:#fff;stroke:#aab5c2;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3B6FB6;stroke-width:2}.gold{fill:#fff3d8;stroke:#b8862d;stroke-width:2}.red{fill:#fbecea;stroke:#b84b41;stroke-width:2}.green{fill:#e9f5ed;stroke:#43825c;stroke-width:2}.line{stroke:#596b7c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#3B6FB6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b98a6;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="40" y="42" class="title">The methods differ in where they place the constraint</text>
<rect x="28" y="75" width="330" height="300" rx="12" class="card"/><rect x="385" y="75" width="330" height="300" rx="12" class="card"/><rect x="742" y="75" width="330" height="300" rx="12" class="card"/>
<text x="193" y="111" text-anchor="middle" class="head">Contrastive loss</text><text x="550" y="111" text-anchor="middle" class="head">Asymmetric paths</text><text x="907" y="111" text-anchor="middle" class="head">Redundancy control</text>
<rect x="66" y="140" width="100" height="43" rx="7" class="blue"/><rect x="220" y="140" width="100" height="43" rx="7" class="gold"/><text x="116" y="167" text-anchor="middle" class="small">anchor</text><text x="270" y="167" text-anchor="middle" class="small">positive</text><path d="M 166 161 L 216 161" class="accent"/><text x="193" y="219" text-anchor="middle" class="small">Negatives create</text><text x="193" y="243" text-anchor="middle" class="small">competing candidates.</text><rect x="70" y="275" width="250" height="50" rx="8" class="red"/><text x="195" y="305" text-anchor="middle" class="small">Push negatives apart</text>
<rect x="423" y="140" width="100" height="43" rx="7" class="blue"/><rect x="576" y="140" width="100" height="43" rx="7" class="gold"/><text x="473" y="167" text-anchor="middle" class="small">online</text><text x="626" y="167" text-anchor="middle" class="small">target</text><path d="M 523 161 L 570 161" class="accent"/><text x="550" y="219" text-anchor="middle" class="small">Stop-gradient or</text><text x="550" y="243" text-anchor="middle" class="small">moving target branch.</text><rect x="427" y="275" width="250" height="50" rx="8" class="gold"/><text x="552" y="305" text-anchor="middle" class="small">Break branch symmetry</text>
<rect x="780" y="140" width="100" height="43" rx="7" class="blue"/><rect x="934" y="140" width="100" height="43" rx="7" class="green"/><text x="830" y="167" text-anchor="middle" class="small">features</text><text x="984" y="167" text-anchor="middle" class="small">statistics</text><path d="M 880 161 L 928 161" class="accent"/><text x="907" y="219" text-anchor="middle" class="small">Keep each coordinate</text><text x="907" y="243" text-anchor="middle" class="small">variable; limit redundancy.</text><rect x="784" y="275" width="250" height="50" rx="8" class="green"/><text x="909" y="305" text-anchor="middle" class="small">Variance / covariance</text>
<text x="550" y="418" text-anchor="middle" class="tiny">Conceptual comparison: methods use different objectives and are not mathematically interchangeable.</text>
</svg>